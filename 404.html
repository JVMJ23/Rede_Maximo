<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada - Rede Máximo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      max-width: 560px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 12px; color: #d35400; }
    p { margin: 0 0 18px; line-height: 1.5; }
    a {
      display: inline-block;
      text-decoration: none;
      background: #0c5aa6;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Erro 404</h1>
    <p>A página que você tentou acessar não existe ou foi movida.</p>
    <a href="/index.html">Voltar para a página inicial</a>
  </main>
</body>
</html>
